name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  check:
    name: lint · typecheck · test · build · wwg
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit / integration tests
        run: npm run test
        env:
          NODE_ENV: test
          CORS_ALLOWED_ORIGINS: http://localhost:5000,http://localhost:5173
          RATE_LIMIT_MAX_REQUESTS: "10000"

      - name: Build
        run: npm run build

      - name: WWG validate
        run: npm run wwg:validate

      - name: WWG CI validate
        run: npm run wwg:ci:validate
